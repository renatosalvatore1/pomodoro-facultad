  .btn-strong { background: var(--strong); color: var(--on-strong); border: 0; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .btn-soft { background: var(--surface-2); color: var(--ink); border: 0; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .btn-pill { min-height: 44px; padding: 0 16px; border-radius: 9999px; border: 0; background: var(--surface-2); color: var(--ink); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
  .btn-main { min-height: 54px; padding: 0 22px; border-radius: 18px; border: 0; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
  .btn-danger { color: var(--pink-text); background: var(--pink-tint); }
  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: var(--surface-2); }
  .seg > button { flex: 1 1 0; min-width: 0; min-height: 40px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: var(--ink-2); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .seg > button[aria-checked="true"], .seg > button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); font-weight: 700; }
  .seg > button:disabled { opacity: 0.5; cursor: not-allowed; }
  .seg.sm > button { min-height: 32px; font-size: 13px; padding: 0 14px; }
  .inp { width: 100%; box-sizing: border-box; min-height: 48px; padding: 0 14px; border: 0; border-radius: 14px; background: var(--inp-bg); color: var(--ink); font: inherit; font-size: 16px; }
  .inp::placeholder { color: var(--muted); opacity: 0.85; }
  .inp:focus { outline: 2px solid var(--primary); outline-offset: 0; }
  .chip { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px; border-radius: 9999px; border: 2px solid transparent; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 9999px; flex: none; }
  .sep > * + * { border-top: 1px solid var(--line); }
  .sw { position: relative; width: 46px; height: 28px; flex: none; border: 0; border-radius: 9999px; background: var(--sw-off); cursor: pointer; padding: 0; transition: background 0.2s; }
  .sw > span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 9999px; background: #FFFFFF; transition: transform 0.2s; }
  .sw[aria-checked="true"] > span { transform: translateX(18px); }
  .sw:disabled { opacity: 0.45; cursor: not-allowed; }
  .no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }
  button, a { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
</style>
